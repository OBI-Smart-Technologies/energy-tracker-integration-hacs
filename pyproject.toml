[project]
name = "energy-tracker-integration-hacs"
version = "0.1.0"
description = "OBI ENERGY TRACKER Home Assistant Integration"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "OBI Smart Technologies GmbH" }]
maintainers = [
    { name = "Fabian Stefer" },
    { name = "Clemens Lermen" },
]
requires-python = ">=3.14"

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "obi-energy-tracker==0.1.0",
    "pytest-homeassistant-custom-component==0.13.366",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
strict = true
local_partial_types = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]

[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
